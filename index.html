<style>
:root{--primary-blue:#1e3a8a;--teal:#0d9488;--bg:#f1f5f9;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:#0f172a;line-height:1.8}
header{background:linear-gradient(135deg,var(--primary-blue),var(--teal));color:#fff;text-align:center;padding:18px 12px}
header h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;opacity:.9;font-size:.95rem}
main{max-width:820px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:18px;margin-bottom:16px}
input[type=text],input[type=number]{width:100%;padding:12px;font-size:1.1rem;border:2px solid #cbd5e1;border-radius:10px;margin:10px 0;text-align:center}
button{background:var(--primary-blue);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:1.05rem;cursor:pointer;width:100%}
button:disabled{opacity:.6;cursor:not-allowed}
.err{color:var(--bad);font-weight:700;min-height:1.5em}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:8px;background:#fff;border-bottom:3px solid var(--teal);padding:10px 14px;font-weight:700;color:var(--primary-blue)}
.sec{background:var(--primary-blue);color:#fff;padding:8px 14px;border-radius:10px;margin:18px 0 10px;font-weight:700}
.qn{color:var(--teal);font-weight:800}
.qimg{display:block;max-width:100%;margin:10px auto;border-radius:8px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid #e2e8f0;border-radius:10px;padding:9px 12px;margin:8px 0;cursor:pointer}
.opt:hover{border-color:var(--teal)}
.opt input{width:18px;height:18px}
.opt.sel{border-color:var(--primary-blue);background:#eff6ff}
.opt.right{border-color:var(--ok);background:#f0fdf4}
.opt.wrong{border-color:var(--bad);background:#fef2f2}
.fb{margin-top:8px;font-weight:700}
.banner{text-align:center;font-size:1.6rem;font-weight:800;color:#fff;background:var(--teal);border-radius:14px;padding:16px;margin-bottom:12px}
.sync{text-align:center;font-weight:700;margin-bottom:14px}
.hidden{display:none}
@media(max-width:480px){main{padding:8px}.card{padding:12px}}
</style>
</head>

const EXTS = ['png','jpg','jpeg','webp','svg','gif','PNG','JPG','JPEG'];
const $ = id => document.getElementById(id);
let studentId = "", studentName = "", seconds = 0, tick = null, submitted = false;

function imgTag(n){
  return `<img class="qimg" alt="" data-n="${n}" data-i="0" src="img/${n}.${EXTS[0]}" onerror="nextExt(this)">`;
}
function nextExt(el){
  const i = +el.dataset.i + 1;
  if (i >= EXTS.length) { el.style.display = 'none'; el.onerror = null; return; }
  el.dataset.i = i;
  el.src = `img/${el.dataset.n}.${EXTS[i]}`;
}

function render(){
  $('questions').innerHTML = QUESTIONS.map((q,i)=>{
    const n = i+1;
    return (q.sec ? `<div class="sec">${q.sec}</div>` : '') + `
    <div class="card" id="q${n}" data-tag="${q.tag}">
      <div><span class="qn">سؤال ${n}:</span> ${q.t}</div>
      ${imgTag(n)}
      ${q.o.map((o,j)=>`<label class="opt" data-j="${j}"><input type="radio" name="q${n}" value="${j}"><span>${o}</span></label>`).join('')}
      <div class="fb"></div>
    </div>`;
  }).join('');
  document.querySelectorAll('.opt input').forEach(r=>r.addEventListener('change',()=>{
    if (submitted) return;
    const card = r.closest('.card');
    card.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
    r.closest('.opt').classList.add('sel');
  }));
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}

$('login-btn').addEventListener('click', login);
$('sid').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });

async function login(){
  const id = $('sid').value.trim();
  const err = $('login-err'); err.textContent = '';
  if (!id){ err.textContent = 'الكود غير صحيح'; return; }
  const btn = $('login-btn'); btn.disabled = true; btn.textContent = 'جارٍ التحقق...';
  try{
    const res = await fetch(`${SCRIPT_URL}?student_id=${encodeURIComponent(id)}`);
    const data = await res.json();
    if (data && data.valid){
      studentId = id; studentName = data.student_name || '';
      $('login-section').classList.add('hidden');
      $('exam-section').classList.remove('hidden');
      $('welcome').textContent = `مرحباً بك: ${studentName}`;
      render();
      tick = setInterval(()=>{
        seconds++;
        $('timer').textContent = String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');
      },1000);
    } else {
      err.textContent = (data && data.error) ? data.error : 'الكود غير مسجل في قاعدة البيانات.';
    }
  }catch(e){
    err.textContent = 'تعذر الاتصال بالخادم، حاول مرة أخرى.';
  }
  btn.disabled = false; btn.textContent = 'تحقق ودخول';
}

$('submit-btn').addEventListener('click', submitExam);

async function submitExam(){
  if (submitted) return;
  const btn = $('submit-btn');
  btn.disabled = true; btn.textContent = 'جارٍ الإرسال...';
  submitted = true; clearInterval(tick);

  let score = 0; const weaknesses = new Set(); const details = [];
  QUESTIONS.forEach((q,i)=>{
    const n = i+1, card = $('q'+n);
    const chosen = card.querySelector('input:checked');
    const sel = chosen ? +chosen.value : null;
    const ok = sel === q.a;
    if (ok) score++; else weaknesses.add(q.tag);
    details.push({q:n, selected: sel===null?null:sel+1, correct:q.a+1, isCorrect:ok, tag:q.tag});
    card.querySelectorAll('input').forEach(r=>r.disabled=true);
    card.querySelectorAll('.opt').forEach(o=>{
      const j = +o.dataset.j;
      if (j===q.a) o.classList.add('right');
      else if (j===sel) o.classList.add('wrong');
    });
    const fb = card.querySelector('.fb');
    fb.style.color = ok ? 'var(--ok)' : 'var(--bad)';
    fb.textContent = ok ? '✔ إجابة صحيحة' : (sel===null ? '✘ لم تجب – الإجابة الصحيحة موضحة بالأخضر' : '✘ إجابة خاطئة – الإجابة الصحيحة موضحة بالأخضر');
  });

  const total = QUESTIONS.length;
  $('result').classList.remove('hidden');
  $('banner').textContent = `النتيجة: ${score} / ${total}`;
  $('sync').textContent = 'جارٍ حفظ النتيجة...';
  $('result').scrollIntoView({behavior:'smooth'});

  const payload = {
    studentId, subject: EXAM_META.subject, module: EXAM_META.module,
    lesson: EXAM_META.lesson, assessmentType: EXAM_META.type,
    score, total, timeSeconds: seconds, weaknesses: [...weaknesses], details
  };
  try{
    // text/plain لتجنب مشاكل CORS مع Google Apps Script
    const res = await fetch(SCRIPT_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
    await res.text();
    $('sync').style.color = 'var(--ok)';
    $('sync').textContent = '✔ تم حفظ نتيجتك بنجاح';
  }catch(e){
    try{
      await fetch(SCRIPT_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload)});
      $('sync').style.color = 'var(--ok)';
      $('sync').textContent = '✔ تم إرسال نتيجتك';
    }catch(e2){
      $('sync').style.color = 'var(--bad)';
      $('sync').textContent = '✘ تعذر حفظ النتيجة، أبلغ المعلم وأرسل له لقطة شاشة.';
    }
  }
  btn.classList.add('hidden');
  if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
}
</script>
